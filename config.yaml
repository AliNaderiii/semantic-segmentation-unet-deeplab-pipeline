# Pascal VOC 2012 semantic-segmentation reference configuration.
dataset:
  name: pascal_voc_2012
  root: data
  # binary_foreground maps any VOC object (1-20) to foreground. It is not a
  # defect dataset. Use voc_multiclass + 21 classes for native VOC labels.
  task: binary_foreground
  image_size: 256
  # Development validation is deterministic and comes only from official train.
  # Official VOC val remains untouched until src.evaluate.
  validation_fraction: 0.20
  split_seed: 42
  # Non-null limits are smoke-test/dev controls, never a reportable full protocol.
  max_train_samples: null
  max_test_samples: null

model:
  name: unet                # unet, deeplabv3plus, fpn
  encoder: resnet18
  pretrained: true
  num_classes: 2

training:
  batch_size: 8
  epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.00001
  scheduler_patience: 3
  scheduler_factor: 0.5
  early_stopping_patience: 7
  loss_dice_weight: 0.5
  loss_ce_weight: 0.5

runtime:
  seed: 42
  deterministic: true
  num_workers: 0
