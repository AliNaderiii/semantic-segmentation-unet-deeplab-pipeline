<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Pascal VOC semantic segmentation v2 pipeline</title><desc id="desc">A reproducible workflow from official VOC splits through void-aware training, evaluation, and checkpoint-safe serving.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081b2d"/><stop offset="1" stop-color="#12324b"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".25"/></filter></defs>
  <rect width="1200" height="590" rx="28" fill="url(#bg)"/><text x="70" y="83" fill="#fff" font-family="Arial,sans-serif" font-size="37" font-weight="700">Semantic Segmentation · Reproducible v2 Pipeline</text><text x="70" y="119" fill="#b9d9ec" font-family="Arial,sans-serif" font-size="19">Pascal VOC · explicit scope · void-aware metrics · checkpoint-safe inference</text>
  <g font-family="Arial,sans-serif" filter="url(#shadow)"><rect x="70" y="190" width="245" height="210" rx="18" fill="#e9f7ff"/><text x="98" y="240" fill="#0c3650" font-size="24" font-weight="700">1 · Official data</text><text x="98" y="278" fill="#31526a" font-size="18">VOC train / validation</text><text x="98" y="310" fill="#31526a" font-size="18">Void label 255 preserved</text><text x="98" y="342" fill="#31526a" font-size="18">No validation augmentation</text>
  <rect x="390" y="190" width="245" height="210" rx="18" fill="#e8fff5"/><text x="418" y="240" fill="#07543c" font-size="24" font-weight="700">2 · Training</text><text x="418" y="278" fill="#2c6555" font-size="18">U-Net / DeepLab / FPN</text><text x="418" y="310" fill="#2c6555" font-size="18">Dice + CE ignores void</text><text x="418" y="342" fill="#2c6555" font-size="18">Seeded experiment config</text>
  <rect x="710" y="190" width="245" height="210" rx="18" fill="#fff4df"/><text x="738" y="240" fill="#754600" font-size="24" font-weight="700">3 · Evidence</text><text x="738" y="278" fill="#725a30" font-size="18">Global confusion matrix</text><text x="738" y="310" fill="#725a30" font-size="18">Dataset-level mIoU / Dice</text><text x="738" y="342" fill="#725a30" font-size="18">Self-describing checkpoint</text>
  <rect x="1010" y="190" width="120" height="210" rx="18" fill="#f4eaff"/><text x="1035" y="240" fill="#5a2375" font-size="24" font-weight="700">4</text><text x="1035" y="278" fill="#633e76" font-size="18">API</text><text x="1035" y="310" fill="#633e76" font-size="18">503</text><text x="1035" y="342" fill="#633e76" font-size="16">without</text><text x="1035" y="365" fill="#633e76" font-size="16">model</text></g>
  <g stroke="#64d6ff" stroke-width="5" fill="none"><path d="M315 295H370"/><path d="M635 295H690"/><path d="M955 295H990"/></g><g fill="#64d6ff"><path d="M370 286l16 9-16 9z"/><path d="M690 286l16 9-16 9z"/><path d="M990 286l16 9-16 9z"/></g>
  <rect x="70" y="465" width="1060" height="58" rx="13" fill="#1c4a68"/><text x="98" y="501" fill="#e5f8ff" font-family="Arial,sans-serif" font-size="20">Published claims come only from a recorded experiment: code + config + data provenance + checkpoint + metrics.</text>
