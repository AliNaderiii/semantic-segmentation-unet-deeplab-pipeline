<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 650" role="img" aria-labelledby="title desc">
  <title id="title">Pascal VOC semantic segmentation evaluation-safe pipeline</title>
  <desc id="desc">Official Pascal VOC train is split deterministically for development training and validation. Official VOC validation remains held out for one final evaluation after checkpoint selection.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b2e"/><stop offset="1" stop-color="#123b55"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1320" height="650" rx="28" fill="url(#background)"/>
  <text x="72" y="82" fill="#ffffff" font-family="Arial, sans-serif" font-size="37" font-weight="700">Pascal VOC Semantic Segmentation · Evaluation-Safe v3</text>
  <text x="72" y="118" fill="#b9d9ec" font-family="Arial, sans-serif" font-size="19">deterministic development split · void-aware metrics · held-out official validation</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="64" y="188" width="255" height="230" rx="18" fill="#e9f7ff"/>
    <text x="91" y="235" fill="#0c3650" font-size="23" font-weight="700">1 · Official VOC train</text>
    <text x="91" y="275" fill="#31526a" font-size="17">Source images + masks</text>
    <text x="91" y="308" fill="#31526a" font-size="17">Void label 255 preserved</text>
    <text x="91" y="341" fill="#31526a" font-size="17">Seeded identifier manifest</text>

    <rect x="377" y="188" width="255" height="230" rx="18" fill="#e8fff5"/>
    <text x="405" y="235" fill="#07543c" font-size="23" font-weight="700">2 · Development split</text>
    <text x="405" y="275" fill="#2c6555" font-size="17">Train subset + validation</text>
    <text x="405" y="308" fill="#2c6555" font-size="17">Validation selects model</text>
    <text x="405" y="341" fill="#2c6555" font-size="17">Scheduler / early stopping</text>

    <rect x="690" y="188" width="255" height="230" rx="18" fill="#fff4df"/>
    <text x="718" y="235" fill="#754600" font-size="23" font-weight="700">3 · Checkpoint evidence</text>
    <text x="718" y="275" fill="#725a30" font-size="17">U-Net / DeepLab / FPN</text>
    <text x="718" y="308" fill="#725a30" font-size="17">Global mIoU / Dice</text>
    <text x="718" y="341" fill="#725a30" font-size="17">Protocol + split metadata</text>

    <rect x="1003" y="188" width="255" height="230" rx="18" fill="#f4eaff"/>
    <text x="1031" y="235" fill="#5a2375" font-size="23" font-weight="700">4 · Official VOC val</text>
    <text x="1031" y="275" fill="#633e76" font-size="17">Untouched during selection</text>
    <text x="1031" y="308" fill="#633e76" font-size="17">One final evaluation</text>
    <text x="1031" y="341" fill="#633e76" font-size="17">Report + dashboard</text>
  </g>

  <g stroke="#64d6ff" stroke-width="5" fill="none"><path d="M319 303H357"/><path d="M632 303H670"/><path d="M945 303H983"/></g>
  <g fill="#64d6ff"><path d="M357 294l16 9-16 9z"/><path d="M670 294l16 9-16 9z"/><path d="M983 294l16 9-16 9z"/></g>

  <rect x="64" y="479" width="1194" height="89" rx="15" fill="#1c4a68"/>
  <text x="94" y="517" fill="#e5f8ff" font-family="Arial, sans-serif" font-size="20">The official VOC validation split is not used for model selection, scheduler decisions, or early stopping.</text>
  <text x="94" y="548" fill="#b9d9ec" font-family="Arial, sans-serif" font-size="18">Publish results only with recorded code, config, split manifest, environment, checkpoint hash, and held-out metrics.</text>
</svg>
